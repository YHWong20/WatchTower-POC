# Lite profile for an 8 GB MacBook Air (WT_PROFILE=lite): 1 master + 1 worker.
# Fault target is the worker: its kubelet and its pods reach the API only across the switch,
# so congesting its port reproduces the same mechanism as the real incident (API calls time
# out, lease renewals missed for > 40 s, transient NotReady, no reboot). What the lite lab
# cannot show is the master-specific "2 in 3 calls" pattern, which needs three API servers;
# that part is carried by the slides, the wireframes and the recorded replay.
# Create with: kind create cluster --name ocp-sim --config lab/kind-config-lite.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  serviceSubnet: 10.96.0.0/16
nodes:
  - role: control-plane          # ocp-sim-control-plane -> master-1
    labels: {wt/role: master, wt/name: master-1}
  - role: worker                 # ocp-sim-worker        -> worker-1 (fault target, cisco-sim-1 Gi1/0/13)
    labels: {wt/role: worker, wt/name: worker-1}
# Mirror OpenShift's node timings: NotReady after 40 s without a lease renewal. Kubernetes
# >= 1.32 defaults to 50 s, so pin it. kubeadm v1beta4 takes extraArgs as a list, and the list
# replaces kind's own, so kind's enable-hostpath-provisioner is restated here.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    controllerManager:
      extraArgs:
        - name: enable-hostpath-provisioner
          value: "true"
        - name: node-monitor-grace-period
          value: "40s"
